<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quản lý Công trình - Điều hành & Hồ sơ</title>
    <style>
        /* Reset CSS để iframe chiếm toàn bộ không gian trình duyệt */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Ngăn thanh cuộn kép */
            background-color: #f4f7f6;
        }
        
        /* Cấu hình iframe toàn màn hình */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Lớp phủ loading chống màn hình trắng khi chờ phản hồi từ Google Server */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #0056b3;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="loader">Đang kết nối hệ thống máy chủ...</div>

    <iframe 
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbzytY9BOG6msre6RJsDXqQN4uqtt4kmzrRpo2FZv1DWzrbXktqrc7QyKKaY4Z4o1yY/exec" 
        allowfullscreen>
    </iframe>

    <script>
        // Ẩn lớp phủ loading sau khi iframe đã tải xong HTML ban đầu
        document.getElementById('appFrame').onload = function() {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 500);
        };
    </script>
</body>
</html>
